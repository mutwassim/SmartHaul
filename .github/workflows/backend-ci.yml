name: Backend CI

on:
  push:
    branches: [main]
    paths: ['Backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['Backend/**', '.github/workflows/backend-ci.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smarthaul
          POSTGRES_PASSWORD: smarthaul
          POSTGRES_DB: smarthaul_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smarthaul"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://smarthaul:smarthaul@localhost:5432/smarthaul_test
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      AES_SECRET_KEY: 9f8e7d6c5b4a3928170e1d2c3b4a5f6e7d8c9b0a1f2e3d4c5b6a7f8e9d0c1b2a

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      # Apply committed migrations; falls back to pushing the schema until the first migration is committed (DEF-15)
      - name: Create database schema
        run: |
          if [ -d prisma/migrations ]; then
            npx prisma migrate deploy
          else
            npx prisma db push --skip-generate
          fi

      - run: npm run prisma:seed

      - run: npm test
