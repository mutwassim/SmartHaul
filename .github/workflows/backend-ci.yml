name: SmartHaul CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ==========================================
  # 1. CI Stage: Automated Tests & Verification
  # ==========================================
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smarthaul
          POSTGRES_PASSWORD: smarthaul
          POSTGRES_DB: smarthaul_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smarthaul"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://smarthaul:smarthaul@localhost:5432/smarthaul_test
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      AES_SECRET_KEY: 9f8e7d6c5b4a3928170e1d2c3b4a5f6e7d8c9b0a1f2e3d4c5b6a7f8e9d0c1b2a

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - name: Create database schema
        run: |
          if [ -d prisma/migrations ]; then
            npx prisma migrate deploy
          else
            npx prisma db push --skip-generate
          fi

      - run: npm run prisma:seed

      - run: npm test

  # ==========================================
  # 2. CD Stage: Automated Deployment to GCP VM
  # ==========================================
  deploy:
    name: Deploy to Production
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GCP VM via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting SmartHaul Production Deployment..."
            cd /www/wwwroot/smarthaul.softezm.com/SmartHaul

            echo "📥 Pulling latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Updating Backend..."
            cd Backend
            npm ci
            npx prisma generate
            if [ -d prisma/migrations ]; then
              npx prisma migrate deploy
            else
              npx prisma db push --skip-generate
            fi
            pm2 restart smarthaul-backend --update-env

            echo "🌐 Updating Next.js Website..."
            cd ../Website
            npm ci
            npm run build
            pm2 restart smarthaul-web --update-env

            echo "🎉 SmartHaul successfully deployed!"
